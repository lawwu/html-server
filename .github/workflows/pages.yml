# The docs site on GitHub Pages (https://lawwu.github.io/html-server/): HTML Server draws
# its README, Docs page, changelog and gallery as static pages (`npm run site`, see
# scripts/build-site.js), and every push to main publishes them. On a push to main rather
# than a release: main is what GitHub shows and what the README's install command
# installs, and the github-pages environment only deploys from the default branch until
# told otherwise (a release's run is on its tag). Needs Settings → Pages → Source: GitHub
# Actions; until then the run stops at configure-pages and nothing is published.
# The build (npm ci, the tests, the site) only reads the repository; publishing to Pages
# (pages: write, and the id-token that proves the run is this repo's) is the deploy job's.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One deploy at a time; a newer push waits for the one in progress rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run site
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
