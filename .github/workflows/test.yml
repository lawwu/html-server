# npm test on the oldest Node the package supports (package.json engines) and the current
# LTS, each in UTC and in a time zone with daylight saving: stats and usage count local
# days, which is where time zones have broken things before.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Node ${{ matrix.node }}, TZ=${{ matrix.tz }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', lts/*]
        tz: [UTC, America/Los_Angeles]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}
