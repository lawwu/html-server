# npm test on Node 24, the oldest Node the package supports (package.json engines), on
# every pull request and push to main. One job: the job name "Node 24" is the check the
# ruleset "main: CI before merging" requires, so renaming it means updating the ruleset.
# Time zones aren't a CI axis: the tests that count local days (stats, usage, visits) run
# themselves in UTC, Los Angeles and Auckland, so a runner in UTC still checks them.
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  # Every test again with PostgreSQL as the database (test/fixture.js: a schema per test),
  # the Cloudflare tests, the docs site build and the tests' own time-zone runs included.
  # REQUIRE_POSTGRES makes a missing URL or driver a failure, and the last step checks that
  # only the SQLite-only tests were skipped: a green run here has to have run against PostgreSQL.
  postgres:
    name: PostgreSQL 16, Node 24
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: html_server
          POSTGRES_PASSWORD: html_server
          POSTGRES_DB: html_server_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U html_server -d html_server_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://html_server:html_server@localhost:5432/html_server_test
      REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Native-driver prerequisites (libpq and a C toolchain, for pg-native)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev build-essential python3
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The PostgreSQL driver loads
        run: npm ls pg-native libpq && node -e "require('pg-native'); console.log('pg-native loaded')"
      - name: npm test, on PostgreSQL
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=tap.txt "test/*.test.js"
      - name: Only the SQLite-only tests were skipped
        run: |
          grep -E '^# (tests|pass|fail|skipped) ' tap.txt
          skipped=$(grep -E '^# skipped ' tap.txt | awk '{print $3}')
          sqlite_only=$(grep -c '# SKIP SQLite only' tap.txt || true)
          if [ "$skipped" != "$sqlite_only" ] || [ "$skipped" -gt 2 ]; then
            echo "expected only the 2 SQLite-only tests to be skipped; $skipped were:"; grep '# SKIP' tap.txt; exit 1
          fi
          grep -q "^ok .*the driver loads and these tests run against PostgreSQL" tap.txt
