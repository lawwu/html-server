# Dependabot opens a pull request each week for newer versions of the npm dependencies
# (`marked`, the only one) and of the GitHub Actions the workflows use, one per ecosystem:
# each group puts that week's updates into a single PR. Patch and minor ones merge
# themselves once CI passes (.github/workflows/dependabot-auto-merge.yml); majors wait for
# a person. A version is only proposed once it's 7 days old: a hijacked release is usually
# pulled before then, and otherwise it would reach `main`, which the README's install
# command installs, without anyone looking. Security fixes don't wait.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
