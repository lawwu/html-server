# Dependabot opens a pull request each week for newer versions of the npm dependencies,
# of the GitHub Actions the workflows use, and of the Docker image's Node base image, one
# per ecosystem: each group puts that week's updates into a single PR. npm and Actions
# patch and minor updates merge themselves once CI passes
# (.github/workflows/dependabot-auto-merge.yml); majors and base images wait for a
# person, who sees the image's own check (docker.yml) first. A version is only proposed
# once it's 7 days old: a hijacked release is usually pulled before then, and otherwise
# it would reach `main`, which the README's install command installs, without anyone
# looking. Security fixes don't wait. The actions' updates also update
# .github/workflows/actions.lock, which records the commit each version is.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
  # The Dockerfile's two FROM lines (one image, pinned by tag and digest). Node 24 only:
  # a new Node major is a decision, not an update.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']
